
<!DOCTYPE html>
<html>
<head>
  <title>Totally Normal Clock Website</title>
  <style>
    body {
      background: black;
      color: lime;
      text-align: center;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    #clocks {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    #clocks img {
      width: 100%;
      max-width: 180px;
    }

    h1 {
      font-size: 35px;
    }
  </style>
</head>
<body>

<h1>🕒 TIME IS RUNNING OUT 🕒</h1>
<h2 id="timer">30 seconds remaining</h2>

<div id="clocks"></div>

<script>
  const clocks = document.getElementById("clocks");
  const timer = document.getElementById("timer");

  const clockImages = [
    "https://placehold.co/180x180/222/fff?text=CLOCK+1",
    "https://placehold.co/180x180/333/fff?text=CLOCK+2",
    "https://placehold.co/180x180/444/fff?text=CLOCK+3",
    "https://placehold.co/180x180/555/fff?text=CLOCK+4"
  ];

  let seconds = 30;

  const prank = setInterval(() => {
    clocks.innerHTML = "";

    for (let i = 0; i < 16; i++) {
      const img = document.createElement("img");
      img.src = clockImages[
        Math.floor(Math.random() * clockImages.length)
      ];
      img.alt = "Harmless clock image";
      clocks.appendChild(img);
    }

    seconds--;
    timer.textContent = seconds + " seconds remaining";

    if (seconds <= 0) {
      clearInterval(prank);
      clocks.innerHTML = "";
      timer.textContent = "😂 YOU HAVE BEEN CLOCKED!";
    }
  }, 1000);
</script>

</body>
</html>
